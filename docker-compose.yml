services:
  app:
    build: .                     # uses the existing Dockerfile
    environment:
      MCP_API_KEY: "dev-local-key"   # fallback only; ignored while secret-name is set
    volumes:
      # LOCAL TESTING ONLY — gives the container your host AWS credentials so it
      # can read from Secrets Manager. Do NOT commit or use on EC2 (the instance
      # role handles this there). Container runs as root -> mount to /root/.aws.
      - "C:/Users/Mergea Sergiu/.aws:/root/.aws:ro"
    expose:
      - "8080"                   # visible to nginx only — NOT published to host
    networks:
      - mcpnet
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                  # redirects to 443
      - "443:443"                # the only public door
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - mcpnet
    restart: unless-stopped

networks:
  mcpnet: