name: Build

# Build the Spring Boot jar on every push / PR, and make the jar downloadable
# as a workflow artifact.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven        # caches ~/.m2 keyed on pom.xml for faster builds

      - name: Build the jar (runs tests)
        # No AWS needed: with MCP_SECRET_NAME unset, the app falls back to
        # dev-local-key, so the Spring context loads on the runner.
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: target/*.jar
          if-no-files-found: error
