name: Build

# Build the Spring Boot jar on every push / PR, and make the jar downloadable
# as a workflow artifact.
on:
  push:
    branches: [master]                     # publish from the default branch...
    tags: ["v*"]                           # ...and on version tags (needed to publish images)
    paths-ignore: ["**.md", "docs/**"]     # don't rebuild for docs-only changes
  pull_request:                            # feature branches are validated via their PR
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven        # caches ~/.m2 keyed on pom.xml for faster builds

      - name: Build the jar (runs tests)
        # No AWS needed: with MCP_SECRET_NAME unset, the app falls back to
        # dev-local-key, so the Spring context loads on the runner.
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: target/*.jar
          if-no-files-found: error

  # Build the Docker image from the multi-stage Dockerfile. On pushes to the
  # default branch or a tag it also pushes the image to GitHub Container
  # Registry (GHCR). On PRs / feature branches it only builds, to validate the
  # Dockerfile without publishing.
  docker:
    name: Docker image
    needs: build            # only build the image if the jar + tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write       # required to push to ghcr.io
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # auto-lowercased by the action
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on default branch / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
